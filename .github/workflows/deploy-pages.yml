name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "output/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow this workflow to publish a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; let in-progress runs finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Self-contained interactive artifacts (the actual deliverables)
          cp output/interactive_map.html      _site/interactive_map.html
          cp output/hdbscan_explorer.html     _site/hdbscan_explorer.html
          cp output/competitor_dashboard.html _site/competitor_dashboard.html
          cp output/top_candidates.csv        _site/top_candidates.csv

      - name: Generate landing page
        run: |
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Geo-Intelligence Site Selection — Demo</title>
            <style>
              :root { color-scheme: light dark; }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                line-height: 1.6;
                background: #0f1115;
                color: #e7e9ee;
              }
              .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
              h1 { font-size: 2rem; margin: 0 0 8px; }
              .sub { color: #9aa3b2; margin: 0 0 36px; }
              .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
              a.card {
                display: block; text-decoration: none; color: inherit;
                background: #1a1d24; border: 1px solid #2a2f3a; border-radius: 12px;
                padding: 20px; transition: border-color .15s, transform .15s;
              }
              a.card:hover { border-color: #4c8bf5; transform: translateY(-2px); }
              a.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
              a.card p { margin: 0; color: #9aa3b2; font-size: .9rem; }
              .note { margin-top: 36px; color: #6b7280; font-size: .85rem; }
              a.repo { color: #4c8bf5; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>Geo-Intelligence Site Selection</h1>
              <p class="sub">Tokyo restaurant demand zones (HDBSCAN) → new-store candidate scoring. Interactive demo.</p>
              <div class="grid">
                <a class="card" href="interactive_map.html">
                  <h2>🗺️ Interactive Site-Selection Map</h2>
                  <p>Top candidate locations with live competitor weighting. Main deliverable.</p>
                </a>
                <a class="card" href="hdbscan_explorer.html">
                  <h2>🔬 HDBSCAN Explorer</h2>
                  <p>Explore the demand-zone clustering across Tokyo restaurant chains.</p>
                </a>
                <a class="card" href="competitor_dashboard.html">
                  <h2>📊 Competitor Dashboard</h2>
                  <p>Competitor landscape overview by chain and ward.</p>
                </a>
                <a class="card" href="top_candidates.csv">
                  <h2>⬇️ Candidate Ranking (CSV)</h2>
                  <p>Raw scored ranking of the top site-selection candidates.</p>
                </a>
              </div>
              <p class="note">
                Note: the interactive maps are large self-contained files (~4–6 MB) and may take a moment to load.<br />
                Source &amp; methodology: <a class="repo" href="https://github.com/wf0601/QSR_new_site_selection">github.com/wf0601/QSR_new_site_selection</a>
              </p>
            </div>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
